name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 웹 파일을 앱 안으로 복사
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html manifest.webmanifest css js data icons android/app/src/main/assets/www/

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Secrets가 있으면 그것을, 없으면 저장소에 들어 있는 키(android/signing)를 사용
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "::add-mask::$KEYSTORE_PASSWORD_SECRET"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            cp android/signing/release.jks "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$(cat android/signing/password.txt)" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK 빌드
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk "russian-study-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: russian-study-apk
          path: russian-study-*.apk

      - name: 릴리스에 올리기 (폰에서 바로 다운로드)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" russian-study-*.apk \
            --title "러시아어 받아쓰기 1.0.${{ github.run_number }}" \
            --notes "폰에서 APK를 받아 설치하세요. 업데이트는 새 APK를 그대로 설치하면 기록이 유지됩니다." \
            --latest
