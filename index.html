<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4fb5">
<meta name="description" content="러시아어 받아쓰기(필기) 암기">
<title>러시아어 받아쓰기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="받아쓰기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>받아쓰기</h1>
  <div class="seg" role="radiogroup" aria-label="문제 방식">
    <button type="button" data-mode="meaning" role="radio">뜻 → 쓰기</button>
    <button type="button" data-mode="letters" role="radio">글자 → 쓰기</button>
  </div>
</header>

<main>
  <!-- 학습 -->
  <section id="view-study" class="view">
    <div id="study-setup"></div>

    <div id="study-card" class="card" hidden>
      <div class="card-meta">
        <div class="bar"><div class="bar-fill" id="q-progress"></div></div>
        <div class="meta-row">
          <span id="q-count"></span>
          <span id="q-info" class="muted"></span>
          <button type="button" class="link" id="btn-quit">그만하기</button>
        </div>
      </div>

      <div class="stage">
        <div class="prompt" id="prompt"></div>
        <div class="pad-wrap">
          <canvas id="pad" aria-label="필기 영역"></canvas>
          <div class="pad-overlay" id="pad-overlay" hidden>단어를 기억하세요…</div>
          <span class="pad-label">내 필기</span>
        </div>
      </div>

      <div class="tools" id="tools">
        <button type="button" class="btn ghost" id="btn-undo">↶ 되돌리기</button>
        <button type="button" class="btn ghost" id="btn-clear">✕ 지우기</button>
        <button type="button" class="btn ghost" id="btn-peek" hidden>👁 다시 보기</button>
      </div>

      <div class="actions" id="actions-ask">
        <button type="button" class="btn primary big" id="btn-reveal">정답 보기</button>
      </div>
      <div class="actions two" id="actions-grade" hidden>
        <button type="button" class="btn wrong big" id="btn-wrong">✗ 틀림</button>
        <button type="button" class="btn right big" id="btn-right">✓ 맞음</button>
      </div>
    </div>

    <div id="study-summary" hidden></div>
  </section>

  <!-- 연습장 -->
  <section id="view-practice" class="view" hidden>
    <div class="practice">
      <div class="hscroll" id="fp-days" aria-label="회차"></div>
      <div class="hscroll" id="fp-words" aria-label="단어"></div>
      <div class="ref" id="fp-ref" hidden>
        <button type="button" class="iconbtn" id="fp-prev" aria-label="이전 단어">‹</button>
        <div class="ref-main"><div class="q ru" id="fp-ref-ru"></div><div class="muted small" id="fp-ref-ko"></div></div>
        <button type="button" class="iconbtn" id="fp-next" aria-label="다음 단어">›</button>
        <div class="ref-side"><span class="muted small" id="fp-count"></span><button type="button" class="btn sm ghost" id="fp-hide">가리기</button></div>
      </div>
      <div class="pad-wrap lined"><canvas id="pad-free" aria-label="연습장"></canvas></div>
      <div class="tools wrap">
        <button type="button" class="btn ghost" id="fp-pen">✏️ 펜</button>
        <button type="button" class="btn ghost" id="fp-eraser">🧽 지우개</button>
        <button type="button" class="btn ghost" id="fp-size">굵기: 보통</button>
        <button type="button" class="btn ghost" id="fp-undo">↶ 되돌리기</button>
        <button type="button" class="btn ghost" id="fp-clear">✕ 전체 지우기</button>
      </div>
    </div>
  </section>
  <section id="view-words" class="view" hidden></section>
  <section id="view-stats" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<nav class="tabbar">
  <button type="button" data-view="study" class="on"><span>✍️</span>학습</button>
  <button type="button" data-view="practice"><span>📝</span>연습장</button>
  <button type="button" data-view="words"><span>📚</span>단어</button>
  <button type="button" data-view="stats"><span>📊</span>통계</button>
  <button type="button" data-view="settings"><span>⚙️</span>설정</button>
</nav>

<div class="toast" id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
